# Development overrides. `local.toml` (git-ignored) layers on top of this file and is
# where `cargo xtask zitadel-bootstrap` and developer-machine overrides live.

[server]
public_url = "https://postit.local:44310"

[server.tls]
enabled = true
cert_path = "../docker/shared/nginx/certs/postit.local.crt"
key_path = "../docker/shared/nginx/certs/postit.local.key"

[database]
# Credentials are secrets: database.username / database.password come from
# !ref/vault/development/postit.env through POSTIT_SECRETS_FILE (backend/.cargo/config.toml).
url = "postgres://localhost:5432/postit"

[auth.oidc]
issuer = "https://postit.local:44300"
audiences = ["postit"]

[auth.bootstrap]
admin_email = "admin@postit.com"

[mail]
from_address = "postit <noreply@postit.local>"

[mail.smtp]
host = "localhost"
port = 25
tls = "none"

[app]
public_url = "https://postit.local:44315"

[cors]
allowed_origins = ["https://postit.local:44315"]

# INSECURE, DEVELOPMENT ONLY: the three keys below are public literals so a fresh checkout
# runs without a vault. Every other environment refuses them (postit_config::DEVELOPMENT_KEYS).
[vault.keys]
1 = "insecure-dev-only-vault-key-00001"

[media]
storage_root = "../.data/media"
signing_key = "insecure-dev-only-media-signing-key"

[email]
signing_key = "insecure-dev-only-email-signing-key"

# identity_mail.signing_key (secret) is written by `cargo xtask zitadel-bootstrap`.
[identity_mail]
enabled = true
bind = "0.0.0.0:44312"
