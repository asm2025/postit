# Production overrides. Secrets (database.username, database.password,
# audit.pseudonym_key, vault.keys.<n>, media.signing_key, email.signing_key,
# mail.smtp.username, mail.smtp.password) are not set here; they
# come from !ref/vault/production/postit.env, which docker/docker-compose.production.yml
# loads with `env_file:`. Identity settings (auth.oidc.issuer, auth.oidc.audiences,
# auth.bootstrap.*), the mail host and sender, the public URLs and the CORS origins are
# deployment-specific `POSTIT__…` env vars; see `deploy/env/production.env.example` and
# docs/configuration.md.

[database]
# postit-postgres on the compose network postit-net; nothing publishes it to the host.
url = "postgres://postit-postgres:5432/postit"

[auth.oidc]
# Native applications in the identity provider, one per mobile platform (see docs/deployment.md).
# android_client_id = ""
# ios_client_id = ""

[server.web]
enabled = true

[mail.smtp]
port = 587
