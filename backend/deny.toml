[graph]
all-features = true

[advisories]
version = 2
ignore = [
	# Marvin attack in `rsa` (no fixed release). Only the `postit-identity` testkit uses it,
	# to mint throwaway RSA test keys; nothing decrypts or signs with it in a shipped build.
	"RUSTSEC-2023-0071",
	# `basic-toml` is unmaintained (no fixed release). `askama_derive` uses it at compile time
	# to parse the template config; no TOML from outside the repository reaches it, and askama
	# 0.16.1 is the latest release. Drop this once askama moves off it.
	"RUSTSEC-2026-0374",
]

[licenses]
version = 2
allow = [
	"MIT",
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Unicode-3.0",
	"Zlib",
	"CC0-1.0",
	"MPL-2.0",
	"0BSD",
	"CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates reference each other by path with no version.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
