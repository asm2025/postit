[package]
name = "postit-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_notify"
path = "src/lib.rs"

[features]
# `Notifier::for_tests` and `notifications_for`, for this crate's tests and its dependents'.
testkit = ["dep:emixdb"]

[dependencies]
postit-config.workspace = true
postit-core.workspace = true
postit-data.workspace = true
postit-http.workspace = true
postit-i18n.workspace = true
postit-jobs.workspace = true
postit-mail.workspace = true
postit-vault.workspace = true
aes-gcm.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
emixcrypto.workspace = true
emixdb = { workspace = true, optional = true }
hkdf.workspace = true
jsonwebtoken.workspace = true
p256 = { workspace = true, features = ["ecdh"] }
rand_core.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
postit-notify = { path = ".", features = ["testkit"] }
postit-data = { workspace = true, features = ["testkit"] }
postit-http = { workspace = true, features = ["testkit"] }
insta.workspace = true
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
