[package]
name = "postit-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_notify"
path = "src/lib.rs"

[features]
# `Notifier::for_tests` and `notifications_for`, for this crate's tests and its dependents'.
testkit = ["dep:emixdb"]

[dependencies]
postit-config.workspace = true
postit-core.workspace = true
postit-data.workspace = true
postit-jobs.workspace = true
postit-mail.workspace = true
async-trait.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
emixdb = { workspace = true, optional = true }
serde.workspace = true
sqlx.workspace = true
thiserror.workspace = true

[dev-dependencies]
postit-notify = { path = ".", features = ["testkit"] }
postit-data = { workspace = true, features = ["testkit"] }
postit-http = { workspace = true, features = ["testkit"] }
postit-i18n.workspace = true
insta.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true
