<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{{ title }}</title>
<style>
body {
  margin: 0;
  padding: 40px 16px;
  background-color: #f8fafc;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color: #1f1e24;
}
main {
  margin-inline: auto;
  max-width: 480px;
  padding: 32px;
  background-color: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 12px;
  text-align: start;
}
h1 { margin-block: 0 16px; font-size: 22px; }
p { margin-block: 0 16px; font-size: 15px; line-height: 1.6; color: #334155; }
button {
  padding: 12px 28px;
  font: inherit;
  font-size: 15px;
  font-weight: 600;
  color: #1d1a1c;
  background-color: #e0679f;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>
<main>
<h1>{{ title }}</h1>
{% block content %}{% endblock %}</main>
</body>
</html>
