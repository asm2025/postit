[package]
name = "postit-drafter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_drafter"
path = "src/lib.rs"

[features]
# A scripted provider and factory, a frame extractor that has none, and agent descriptors with
# no agent crate behind them, for tests here and in the crates that use the drafter.
testkit = []

[dependencies]
postit-config.workspace = true
postit-core.workspace = true
postit-data.workspace = true
postit-http.workspace = true
postit-vault.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
emixdb.workspace = true
futures.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
postit-data = { workspace = true, features = ["testkit"] }
postit-drafter = { path = ".", features = ["testkit"] }
postit-http = { workspace = true, features = ["testkit"] }
chrono.workspace = true
insta.workspace = true
uuid.workspace = true
wiremock.workspace = true

[lints]
workspace = true
