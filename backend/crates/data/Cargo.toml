[package]
name = "postit-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_data"
path = "src/lib.rs"

[features]
default = []
# Exposes the per-batch re-seal steps so tests can interleave concurrent writes.
testkit = []

[dependencies]
postit-config.workspace = true
postit-core.workspace = true
postit-vault = { workspace = true, features = ["sqlx"] }
chrono.workspace = true
emixdb.workspace = true
hmac.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
postit-data = { path = ".", features = ["testkit"] }
tokio.workspace = true
url.workspace = true

[lints]
workspace = true
