[package]
name = "postit-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "postit"

[lib]
name = "postit_server"
path = "src/lib.rs"

[[bin]]
name = "postit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
postit-api.workspace = true
postit-config.workspace = true
postit-core.workspace = true
postit-data.workspace = true
postit-http.workspace = true
postit-identity.workspace = true
postit-jobs.workspace = true
postit-mail.workspace = true
postit-media.workspace = true
postit-agent-mock = { workspace = true, optional = true }
postit-oauth.workspace = true
postit-vault.workspace = true
async-trait.workspace = true
chrono.workspace = true
axum.workspace = true
axum-server.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rustls.workspace = true
sqlx.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# Probes videos with `ffprobe` and cuts video thumbnails with `ffmpeg`.
ffprobe = ["postit-media/ffprobe"]
# Compiles the scripted mock agent in (development and CI images only; production refuses it).
mock-agent = ["dep:postit-agent-mock"]

[dev-dependencies]
# Makes the test builds see the mock agent without a flag on the command line.
postit-server = { path = ".", features = ["mock-agent"] }
bytes.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
image.workspace = true
postit-data = { workspace = true, features = ["testkit"] }
sha2.workspace = true
postit-http = { workspace = true, features = ["testkit"] }
postit-identity = { workspace = true, features = ["testkit"] }
http-body-util.workspace = true
tempfile.workspace = true

[lints]
workspace = true
