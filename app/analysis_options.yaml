include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  exclude:
    - lib/api/**
    - lib/l10n/gen/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_use_package_imports
    - avoid_print
    - prefer_single_quotes
    - unawaited_futures
