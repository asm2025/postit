name: postit
description: The postit mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.6

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  retrofit_generator: ^10.2.12
  json_serializable: ^6.14.1
  swagger_parser: ^1.45.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/logo/
    # The dev CA, copied in by Gradle for development builds (Task 4 Step 5). Never bundled
    # into qa or production.
    - path: assets/dev/
      flavors:
        - development
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/postit-sb.png
  remove_alpha_ios: true
  # Android 8+ masks launcher icons to the launcher's shape: the logo's black fills it and
  # the foreground is the white "p" and pink strokes alone.
  adaptive_icon_background: "#231F20"
  adaptive_icon_foreground: assets/logo/postit-adaptive-fg.png
  # The foreground image is already padded to the safe zone.
  adaptive_icon_foreground_inset: 0

# The logo's black behind its white "p" and pink strokes, the same in dark mode. Android
# 12+ masks the splash icon to a circle, so its image pads the mark to fit inside one.
flutter_native_splash:
  color: "#231F20"
  image: assets/logo/postit-splash.png
  android_12:
    color: "#231F20"
    icon_background_color: "#231F20"
    image: assets/logo/postit-splash-android12.png
  ios: true
  web: false
