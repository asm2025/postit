name: postit
description: The postit mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.6

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_appauth: ^12.1.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  retrofit_generator: ^10.2.12
  json_serializable: ^6.14.1
  swagger_parser: ^1.45.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    # The dev CA, copied in by Gradle for development builds (Task 4 Step 5). Never bundled
    # into qa or production.
    - path: assets/dev/
      flavors:
        - development
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo/postit-sb.png
  remove_alpha_ios: true
  # Android 8+ masks launcher icons; without these the badge is shrunk into a legacy icon.
  adaptive_icon_background: "#E0679F"
  adaptive_icon_foreground: assets/logo/postit-adaptive-fg.png
