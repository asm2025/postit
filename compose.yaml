services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postit
      POSTGRES_PASSWORD: postit
      POSTGRES_DB: postit
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postit -d postit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
