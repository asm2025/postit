name: CI

on:
  push:
    branches: [main, stage]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: check
        run: cargo check --workspace --all-targets
      - name: test
        run: cargo test --workspace

  server-windows:
    name: server (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: check
        run: cargo check --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
