name: CI

on:
  push:
    branches: [main, stage]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Throwaway credentials for the job's own service container; not a vault secret.
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postit
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: install sqlx-cli and cargo-deny
        # sqlx-cli is pinned to the sqlx version in Cargo.lock.
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
          cargo install cargo-deny --version 0.20.2 --locked
      - name: migrate
        # The sqlx query macros check against the live schema when DATABASE_URL is set.
        run: sqlx migrate run --source crates/data/migrations
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: check
        run: cargo check --workspace --all-targets
      - name: sqlx offline cache
        # Each crate that uses the query macros keeps its own .sqlx directory, so the
        # workspace-wide `prepare --check --workspace` of the plan does not apply.
        run: |
          for cache in crates/*/.sqlx; do
            (cd "$(dirname "$cache")" && cargo sqlx prepare --check -- --all-targets)
          done
      - name: deny
        run: cargo deny check
      - name: test
        run: cargo test --workspace

  server-windows:
    name: server (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: check
        run: cargo check --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Reads the exact pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  contract:
    name: contract
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      OASDIFF_VERSION: v1.33.0
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the breaking-change check can find the previous release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install web dependencies
        # cargo xtask openapi runs web/'s pinned openapi-typescript.
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: generated contract is current
        working-directory: server
        run: cargo xtask openapi --check
      - name: no breaking change against the previous release
        run: |
          base="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$base" ]; then
            echo "::notice::no v* release tag yet; breaking-change check skipped"
            exit 0
          fi
          if ! git show "$base:api/openapi.json" > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "::notice::$base has no api/openapi.json; breaking-change check skipped"
            exit 0
          fi
          echo "comparing api/openapi.json with $base"
          docker run --rm \
            -v "$RUNNER_TEMP:/base:ro" -v "$GITHUB_WORKSPACE/api:/head:ro" \
            "tufin/oasdiff:$OASDIFF_VERSION" \
            breaking /base/base.json /head/openapi.json --fail-on ERR
