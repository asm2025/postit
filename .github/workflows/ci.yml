name: CI

on:
  push:
    branches: [main, stage]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  server:
    name: server (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Throwaway credentials for the job's own service container; not a vault secret.
      DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postit
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: install sqlx-cli and cargo-deny
        # sqlx-cli is pinned to the sqlx version in Cargo.lock.
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features rustls,postgres
          cargo install cargo-deny --version 0.20.2 --locked
      - name: migrate
        # The sqlx query macros check against the live schema when DATABASE_URL is set.
        run: sqlx migrate run --source crates/data/migrations
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: check
        run: cargo check --workspace --all-targets
      - name: check the production build
        # The lib and bin with no features, as the production image builds them: the
        # self dev-dependency that turns on mock-agent applies to test targets only.
        run: cargo check -p postit-server
      - name: sqlx offline cache
        # Each crate that uses the query macros keeps its own .sqlx directory, so the
        # workspace-wide `prepare --check --workspace` of the plan does not apply.
        run: |
          for cache in crates/*/.sqlx; do
            (cd "$(dirname "$cache")" && cargo sqlx prepare --check -- --all-targets)
          done
      - name: deny
        run: cargo deny check
      - name: test
        run: cargo test --workspace

  server-windows:
    name: server (windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: check
        run: cargo check --workspace --all-targets
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Reads the exact pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: audit
        run: pnpm audit --prod --audit-level high
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: format
        run: pnpm format:check
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build

  app:
    name: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: install
        run: flutter pub get
      - name: format
        # lib/api is generated and never formatted by hand.
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/data lib/state lib/ui test integration_test
      - name: analyze
        run: flutter analyze
      - name: test
        run: flutter test
      - name: stand-in dev CA
        # The real CA is git-ignored, so without a file here the APK check below could not
        # notice the flavor filter on assets/dev/ breaking.
        run: printf 'stand-in, not a certificate\n' > assets/dev/postit-dev-ca.crt
      - name: build qa and production
        run: |
          flutter build apk --flavor qa --debug --dart-define-from-file=config/qa.json
          flutter build apk --flavor production --debug --dart-define-from-file=config/production.json
      - name: no dev trust configuration in qa or production
        # The development flavor's network_security_config, its raw CA resource, and the dev
        # CA Flutter asset (for dio) must never ship.
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          for flavor in qa production; do
            apk="build/app/outputs/flutter-apk/app-$flavor-debug.apk"
            if "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" | grep -qi networkSecurityConfig; then
              echo "::error::the $flavor APK manifest references a network security config"; exit 1
            fi
            if unzip -l "$apk" | grep -Ei 'network_security_config|postit[-_]dev[-_]ca'; then
              echo "::error::the $flavor APK contains dev trust files"; exit 1
            fi
            echo "$flavor APK carries no dev trust configuration"
          done

  contract:
    name: contract
    runs-on: ubuntu-latest
    env:
      SQLX_OFFLINE: "true"
      OASDIFF_VERSION: v1.33.0
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the breaking-change check can find the previous release.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install web dependencies
        # cargo xtask openapi runs web/'s pinned openapi-typescript.
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - name: install app dependencies
        # cargo xtask openapi also generates the Dart client in app/lib/api.
        working-directory: app
        run: flutter pub get
      - name: generated contract is current
        working-directory: server
        run: cargo xtask openapi --check
      - name: no breaking change against the previous release
        run: |
          base="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -z "$base" ]; then
            echo "::notice::no v* release tag yet; breaking-change check skipped"
            exit 0
          fi
          if ! git show "$base:api/openapi.json" > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "::notice::$base has no api/openapi.json; breaking-change check skipped"
            exit 0
          fi
          echo "comparing api/openapi.json with $base"
          docker run --rm \
            -v "$RUNNER_TEMP:/base:ro" -v "$GITHUB_WORKSPACE/api:/head:ro" \
            "tufin/oasdiff:$OASDIFF_VERSION" \
            breaking /base/base.json /head/openapi.json --fail-on ERR

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: stack doctor tests
        # Launcher logic, fixture vaults only; no Docker needed.
        run: bash docker/tests/stack-doctor.sh
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          tags: postit-server:ci
          build-args: CARGO_FEATURES=mock-agent
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: start smoke stack
        run: docker compose -f docker/ci/docker-compose.smoke.yml up -d
      - name: probe health, readiness and web config
        run: bash docker/ci/smoke.sh
      - name: stop smoke stack
        if: always()
        run: docker compose -f docker/ci/docker-compose.smoke.yml down -v
