[package]
name = "postly"
description = "A social media platform for sharing posts and connecting with others."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
authors = ["asm <asm2do@outlook.com>"]
repository = "https://github.com/asm2025/postly"

[dependencies]
anyhow = "1"
chrono = "0"
dotenv = "0"
futures = "0"
html-entities = "0"
humantime = "2"
log = "0"
num_cpus = "1"
rand = "0"
reqwest = { version = "0", features = ["blocking", "cookies", "json", "gzip", "deflate", "multipart", "socks", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"

[workspace]
members = [
	"."
]

[package.metadata.scripts]
run = "cargo run"
check = "cargo check"
build = "cargo build"
release = "cargo build --release"
features = "cargo feature %1"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
opt-level = 3
debug = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
