[package]
name = "postit-agent-kit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_agent_kit"
path = "src/lib.rs"

[features]
default = []
# Fakes, test contexts, and a mock OAuth provider for agent crates' tests.
testkit = [
    "dep:async-trait",
    "dep:chrono",
    "dep:postit-config",
    "dep:secrecy",
    "dep:serde_json",
    "dep:sha2",
    "dep:url",
    "dep:wiremock",
    "postit-http/testkit",
]

[dependencies]
async-trait = { workspace = true, optional = true }
bytes.workspace = true
chrono = { workspace = true, optional = true }
futures.workspace = true
postit-config = { workspace = true, optional = true }
postit-core.workspace = true
postit-http.workspace = true
reqwest.workspace = true
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
postit-config.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
url.workspace = true
uuid.workspace = true
wiremock.workspace = true

[lints]
workspace = true
