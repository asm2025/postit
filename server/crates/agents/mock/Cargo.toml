[package]
name = "postit-agent-mock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "postit_agent_mock"
path = "src/lib.rs"

[features]
default = []
# `MockScript` implements the conformance suite's `Faults`.
testkit = ["postit-agent-kit/testkit"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
postit-agent-kit.workspace = true
postit-core.workspace = true
postit-http.workspace = true
secrecy.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
postit-agent-kit = { workspace = true, features = ["testkit"] }
postit-agent-mock = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true

[lints]
workspace = true
