[workspace]
resolver = "3"
members = [
	"crates/config",
	"crates/http",
	"crates/data",
	"crates/jobs",
	"crates/mail",
	"crates/identity",
	"crates/oauth",
	"crates/api",
	"crates/server",
	"crates/core",
	"crates/i18n",
	"crates/vault",
	"crates/agent-kit",
	"crates/agents/mock",
	"xtask",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["asm <asm2do@outlook.com>"]
repository = "https://github.com/asm2025/postit"
publish = false

[workspace.dependencies]
async-trait = "0"
emixdb = "0"
figment = { version = "0", features = ["toml"] }
secrecy = { version = "0", features = ["serde"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
proptest = "1"
tempfile = "3"
wiremock = "0"
postit-config = { path = "crates/config" }
postit-http = { path = "crates/http" }
postit-data = { path = "crates/data" }
postit-jobs = { path = "crates/jobs" }
postit-mail = { path = "crates/mail" }
postit-identity = { path = "crates/identity" }
postit-api = { path = "crates/api" }
postit-oauth = { path = "crates/oauth" }
postit-core = { path = "crates/core" }
postit-i18n = { path = "crates/i18n" }
postit-vault = { path = "crates/vault" }
postit-agent-kit = { path = "crates/agent-kit" }
postit-agent-mock = { path = "crates/agents/mock" }

anyhow = "1"
regex = "1"
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
emixcrypto = { version = "0", default-features = false, features = ["sha2"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
governor = "0.10"
http-body-util = "0.1"
ipnet = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "request-id", "sensitive-headers", "set-header", "timeout", "trace", "util"] }
utoipa = { version = "6", features = ["chrono", "uuid", "url"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
apalis = { version = "=1.0.0-rc.10" }
apalis-postgres = { version = "=1.0.0-rc.9" }
askama = "0.16"
insta = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
chrono = "0"
csv-async = { version = "1", default-features = false, features = ["tokio"] }
cron = "0.17"
futures = "0"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
humantime = "2"
jsonwebtoken = "9"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
moka = { version = "0.12", features = ["sync"] }
p256 = { version = "0.14", features = ["ecdsa", "getrandom", "pkcs8"] }
rand = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "multipart", "stream"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0"
tracing-subscriber = { version = "0", features = ["env-filter", "fmt", "json"] }
ulid = { version = "3", features = ["uuid"] }
url = { version = "2", features = ["serde"] }
urlencoding = "2"
uuid = { version = "1", features = ["v7", "serde"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
unic-langid = "0.9"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.release]
lto = true
opt-level = 3
debug = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
