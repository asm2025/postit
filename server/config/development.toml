# Development overrides. `local.toml` (git-ignored) layers on top of this file and is
# where `cargo xtask zitadel-bootstrap` and developer-machine overrides live.

[server]
public_url = "https://postly.local:44300"

[server.tls]
enabled = true
cert_path = "../docker/shared/nginx/certs/postly.local.crt"
key_path = "../docker/shared/nginx/certs/postly.local.key"

[database]
url = "postgres://postly:postly@localhost:44340/postly"

[auth.oidc]
issuer = "https://postly.local:44330"
audiences = ["postly"]

[auth.bootstrap]
admin_email = "admin@postly.local"

[audit]
# Fixed and clearly insecure: development only, never used outside this file.
pseudonym_key = "dev-only-insecure-pseudonym-key-do-not-use-outside-development"

[mail.smtp]
host = "localhost"
port = 44325
starttls = false

[app]
public_url = "https://postly.local:44310"

[cors]
allowed_origins = ["https://postly.local:44310"]
