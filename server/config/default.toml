# Common baseline for every environment. Values that must differ per environment
# (issuer, database url, secrets, CORS origins, ...) are set in `{env}.toml` or supplied
# through `POSTIT__SECTION__KEY` env vars / `_FILE` secrets. See CLAUDE.md and
# `!ref/plans/02. foundation.md` ("Configuration layering").

[server]
host = "0.0.0.0"
api_port = 44310
worker_port = 44311
shutdown_timeout = "30s"
request_timeout = "30s"
body_limit = 1048576

[server.tls]
enabled = false

[server.web]
enabled = false

[database]
max_connections = 10

[auth.oidc]
client_id = "postit-app"
scopes = ["openid", "profile", "email", "offline_access"]
accepted_algorithms = ["RS256"]
leeway = "1min"
jwks_refresh_interval = "1h"
userinfo = "fallback"

[auth.oidc.claim_names]
email = "email"
email_verified = "email_verified"
name = "name"
preferred_username = "preferred_username"
client_id = "client_id"

[auth.bootstrap]

[auth]
pending_ttl = "30days"
principal_cache_ttl = "5min"
approval_email_interval = "1h"

[audit]
retention = "365days"
ip_retention = "90days"

[retention]
notifications_read_after = "90days"
delivery_attempts_after = "180days"
ai_generation_prompt_after = "30days"
ai_generation_row_after = "365days"
inbox_items = "180days"
direct_sends = "180days"
email_events = "180days"
contact_imports = "30days"

[ops]
check_interval = "5min"
due_delivery_overdue_after = "5min"

[rate_limit.unauthenticated]
rate_per_minute = 60
burst = 20

[rate_limit.provisioning]
rate_per_minute = 10
burst = 5

[rate_limit.authenticated]
rate_per_minute = 300
burst = 60

[mail]
transport = "smtp"
send_email_max_attempts = 8

[mail.smtp]
tls = "starttls"

[jobs]
outbox_poll_interval = "5s"
[jobs.concurrency]
mail = 4
maintenance = 1
default = 4

[jobs.history_retention]
succeeded = "7days"
failed = "30days"

[jobs.schedules]
# apalis-free cron syntax with seconds first: sec min hour day-of-month month day-of-week.
job_history_purge = "0 10 3 * * *"
purge_pending_users = "0 20 3 * * *"
audit_retention = "0 30 3 * * *"
data_retention = "0 40 3 * * *"

[http]
connect_timeout = "5s"
request_timeout = "30s"
user_agent = "postit/0.7.0"

[cors]
allowed_origins = []

# Secret vault master keys by version (POSTIT__VAULT__KEYS__1, ...). Never set here: the keys
# come from the vault. Required outside development.
[vault.keys]

[media]
storage_root = "/var/lib/postit/media"
# media.signing_key (secret) and media.public_base_url come from the environment.
single_request_max = 20000000
chunk_max = 16000000
upload_session_ttl = "24h"
view_url_ttl = "10min"
public_url_ttl = "1h"
# 0 means unlimited.
user_quota_bytes = 21474836480
fit_concurrency = 1
fit_max_duration = "10min"
ffmpeg_path = "ffmpeg"

[email]
# email.signing_key (secret) and email.tracking_base_url come from the environment.
batch_size = 50
image_url_ttl = "365days"
allow_private_hosts = false

[push]
# push.vapid_private_key (secret) and push.vapid_subject are required once enabled.
enabled = false
allow_private_endpoints = false

[publishing]
live = true
max_attempts = 5
lease = "5min"
sweep_grace = "2min"
park_grace = "15min"
processing_timeout = "24h"

[oauth]
# Extra URLs an account connection may return to. Empty means only app.public_url and the
# app's custom URL scheme.
return_to_allowlist = []

[ai]
request_timeout = "120s"
allow_private_endpoints = false

[limits]
# 0 means unlimited. storage_quota_bytes unset uses media.user_quota_bytes.
email_daily_cap = 500
contacts_cap = 10000

[recurrence]
lead = "10min"

[inbox]
active_interval = "5min"
idle_interval = "1h"

[legal]
# privacy_path, terms_path and data_deletion_path are unset by default.

# Per-platform developer apps live in [platforms.<id>] tables (client_id, ...); secrets such
# as client_secret come from POSTIT__PLATFORMS__<ID>__CLIENT_SECRET or its _FILE form.
