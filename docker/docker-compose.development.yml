# Development overrides.
#
#   ./stack.ps1 up            # Windows — "development" is the default environment
#   ./stack.sh up             # macOS / Linux
#   ./stack.ps1 up -App       # also start postit-server and postit-nginx-app (profile "app")
#
# Which resolves to:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.development.yml up -d
#
# Adds the published ports, Zitadel (the dev IdP) and the two nginx TLS front doors, all
# on https://postit.local with the certificate from cert.ps1 / cert.sh. SMTP is not
# bundled: point server/config/development.toml at your own local SMTP tool (e.g. Papercut).
#
# No credential lives in this file. Postgres and Zitadel read theirs from
# !ref/vault/development/ through `env_file:`, exactly as qa and production do — extract
# !ref/vault.7z first (README, "Environment files and secrets").

services:
    postit-postgres:
        # POSTGRES_USER / POSTGRES_PASSWORD. A natively run server reads the same pair
        # from postit.env (database.username / database.password).
        env_file:
            - "../!ref/vault/development/postgres.env"
        ports:
            # Published for `cargo run`, sqlx-cli and `cargo sqlx prepare`.
            - "5432:5432"
        volumes:
            # Creates the `zitadel` database beside `postit`. Runs once, on an empty
            # volume only (postgres image convention) — qa and production run no IdP, so
            # the mount lives here rather than in the base file.
            - "./postgres/init:/docker-entrypoint-initdb.d:ro"

    postit-zitadel:
        image: ghcr.io/zitadel/zitadel:latest
        container_name: postit-zitadel
        restart: unless-stopped
        # --tlsMode external: postit-nginx-infra terminates TLS and proxies plain HTTP.
        # --externalDomain / --externalPort are the issuer the browser and the server see,
        # https://postit.local:44300 — changing either on an initialised database needs
        # `stack reset`, because Zitadel stores the instance domain at first boot.
        command: >
            start-from-init
            --masterkeyFromEnv
            --tlsMode external
            --externalDomain postit.local
            --externalPort 44300
            --steps /steps.yaml
        # ZITADEL_MASTERKEY and the database usernames and passwords.
        env_file:
            - "../!ref/vault/development/zitadel.env"
        environment:
            ZITADEL_DATABASE_POSTGRES_HOST: postit-postgres
            ZITADEL_DATABASE_POSTGRES_PORT: "5432"
            ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
            ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
            ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
        volumes:
            # First-instance seed: the admin@postit.com user and the machine user that
            # `cargo xtask zitadel-bootstrap` authenticates as.
            - "./zitadel/steps.yaml:/steps.yaml:ro"
        depends_on:
            postit-postgres:
                condition: service_healthy
        networks:
            - postit-net

    # TLS front door for the infrastructure: Zitadel (44300).
    postit-nginx-infra:
        image: nginx:1.27-alpine
        container_name: postit-nginx-infra
        restart: unless-stopped
        ports:
            - "44300:44300"
        volumes:
            - "./shared/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
            - "./shared/nginx/infra.conf:/etc/nginx/conf.d/infra.conf:ro"
            - "./shared/nginx/certs:/etc/nginx/certs:ro"
        depends_on:
            - postit-zitadel
        networks:
            postit-net:
                # A containerised server (plan 02 P6) reaches Zitadel's discovery document
                # and JWKS at the same issuer URL the browser uses,
                # https://postit.local:44300, instead of a second, container-only name.
                aliases:
                    - postit.local

    # The real server (role all) behind postit-nginx-app. Plain HTTP inside the network;
    # nginx terminates TLS on 44310/44311 with the dev certificate.
    postit-server:
        profiles: ["app"]
        image: "postit-server:local"
        build:
            context: ..
            dockerfile: docker/server.Dockerfile
        container_name: postit-server
        restart: unless-stopped
        stop_grace_period: 40s
        env_file:
            # database.username / database.password, audit.pseudonym_key.
            - "../!ref/vault/development/postit.env"
        environment:
            POSTIT_ENV: development
            POSTIT_ROLE: all
            POSTIT__SERVER__TLS__ENABLED: "false"
            POSTIT__SERVER__API_PORT: "8080"
            POSTIT__SERVER__WORKER_PORT: "8081"
            POSTIT__DATABASE__URL: "postgres://postit-postgres:5432/postit"
            # The operator's local SMTP tool (e.g. Papercut) on the Docker host.
            POSTIT__MAIL__SMTP__HOST: host.docker.internal
            # Only postit-nginx-app (its fixed address below) may set X-Forwarded-For.
            # Not the whole subnet: Docker Desktop delivers published-port traffic from the
            # gateway (172.30.0.1), so trusting the /24 would let any client spoof its IP.
            POSTIT__SERVER__TRUSTED_PROXIES: "[172.30.0.10/32]"
            # Trust the dev CA so https://postit.local:44300 (Zitadel via postit-nginx-infra)
            # verifies from inside the container.
            POSTIT__HTTP__EXTRA_CA_FILES: "[/certs/postit-dev-ca.crt]"
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            # development.toml and local.toml (issuer, audiences, client id from
            # `cargo xtask zitadel-bootstrap`) replace the image's baked config.
            - "../server/config:/app/config:ro"
            - "./shared/nginx/certs/postit-dev-ca.crt:/certs/postit-dev-ca.crt:ro"
        depends_on:
            postit-postgres:
                condition: service_healthy
            postit-nginx-infra:
                condition: service_started
        networks:
            - postit-net

    # TLS front door for the application: API (44310) and worker (44311) proxied to
    # postit-server, web (44315) a placeholder until plan 02 P7. Behind the `app` profile so
    # those ports stay free for `cargo run` and the web dev server.
    postit-nginx-app:
        image: nginx:1.27-alpine
        container_name: postit-nginx-app
        restart: unless-stopped
        profiles: ["app"]
        ports:
            - "44310:44310"
            - "44311:44311"
            - "44315:44315"
        volumes:
            - "./shared/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
            - "./shared/nginx/app.conf:/etc/nginx/conf.d/app.conf:ro"
            - "./shared/nginx/certs:/etc/nginx/certs:ro"
            - "./shared/nginx/html:/usr/share/nginx/html:ro"
        depends_on:
            - postit-server
        networks:
            postit-net:
                # The one trusted proxy (POSTIT__SERVER__TRUSTED_PROXIES on postit-server).
                ipv4_address: 172.30.0.10

networks:
    postit-net:
        ipam:
            config:
                # Fixed so POSTIT__SERVER__TRUSTED_PROXIES can name it. An existing
                # postit-net created without it must be recreated: `./stack.ps1 down`, then up.
                - subnet: 172.30.0.0/24
