# Development overlay: `docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up`
# (run from `docker/`). Adds published ports, Mailpit, Zitadel (dev IdP), and the nginx
# TLS-terminating front doors. nginx-app (profile "app") serves a placeholder on
# 44300/44305/44310 until plan 02 phases P6/P7 build the real API, worker, and web containers.

services:
  postgres:
    ports:
      - "44340:5432"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "44325:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    command: >
      start-from-init
      --masterkeyFromEnv
      --tlsMode external
      --externalDomain postit.local
      --externalPort 44330
      --steps /steps.yaml
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postit
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postit
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postit
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postit
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Fixed and clearly insecure: development only, never used outside this file.
      ZITADEL_MASTERKEY: DevOnlyInsecureMasterKey32Bytes!
    volumes:
      - ./zitadel/steps.yaml:/steps.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx-infra:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "44320:44320"
      - "44330:44330"
    volumes:
      - ./shared/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./shared/nginx/infra.conf:/etc/nginx/conf.d/infra.conf:ro
      - ./shared/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - mailpit
      - zitadel

  nginx-app:
    image: nginx:1.27-alpine
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "44300:44300"
      - "44305:44305"
      - "44310:44310"
    volumes:
      - ./shared/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./shared/nginx/app.conf:/etc/nginx/conf.d/app.conf:ro
      - ./shared/nginx/certs:/etc/nginx/certs:ro
      - ./shared/nginx/html:/usr/share/nginx/html:ro
