worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Proxied to Zitadel and Mailpit over plain HTTP inside the compose network; TLS is
    # terminated here with the postit.local dev certificate from cert.ps1 / cert.sh.
    include /etc/nginx/conf.d/*.conf;
}
