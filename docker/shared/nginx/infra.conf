# postit-nginx-infra: Zitadel (44300), TLS-terminated at postit.local.

server {
    listen 44300 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    # Inherited by both proxy locations. proxy_set_header is not: a location that sets any
    # header drops all the server-level ones, so each location below lists its full set.
    proxy_http_version 1.1;
    proxy_read_timeout 90s;
    # Zitadel sends both Feature-Policy and Permissions-Policy; Chrome warns and uses the latter.
    proxy_hide_header Feature-Policy;

    # Zitadel's built-in login has no show/hide password toggle, so inject one: the HTML is
    # rewritten on the way out and the two assets are served from this same origin (the login's
    # CSP only allows 'self' and nonces). Upstream must not compress, or sub_filter sees gzip.
    # Scoped to the login so the console and the API keep compression and stay untouched.
    location /postit-login/ {
        alias /etc/nginx/postit-login/;
        add_header Cache-Control "no-cache";
    }

    location /ui/login/ {
        sub_filter_once on;
        sub_filter '</head>' '<link rel="stylesheet" href="/postit-login/show-password.css"><script src="/postit-login/show-password.js" defer></script></head>';
        proxy_pass http://postit-zitadel:8080;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    location / {
        proxy_pass http://postit-zitadel:8080;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
