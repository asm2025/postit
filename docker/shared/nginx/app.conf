# postit-nginx-app (compose profile "app"): TLS for the API (44310) and worker (44311),
# proxied to postit-server; web (44315) proxied to the server's web listener (8082) with the web CSP.

server {
    listen 44310 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    location / {
        proxy_pass http://postit-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

server {
    listen 44311 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    location / {
        proxy_pass http://postit-server:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 44315 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    # The web app's security headers, as plan 02 "QA and production hosting" requires of the
    # proxy (amended by P7): the app frames its own /auth/callback during silent sign-in, so
    # frame-ancestors is 'self' and frame-src allows 'self' (where the iframe ends) and the
    # IdP (where it starts). 'unsafe-inline' covers style attributes set by Radix/shadcn; no
    # inline script is needed (the theme script is /theme-init.js).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://postit.local:44310 https://postit.local:44300; frame-src 'self' https://postit.local:44300; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://postit-server:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
