# nginx-app (compose profile "app"): placeholders for the API (44300), worker (44305),
# and web (44310) until plan 02 phases P6/P7 replace them with the real containers.

server {
    listen 44300 ssl;
    server_name postly.local;

    ssl_certificate     /etc/nginx/certs/postly.local.crt;
    ssl_certificate_key /etc/nginx/certs/postly.local.key;

    root /usr/share/nginx/html;

    location / {
        try_files /placeholder.html =404;
    }
}

