# postit-nginx-app (compose profile "app"): placeholders for the API (44310), worker (44311),
# and web (44315) until plan 02 phases P6/P7 replace them with the real containers.

server {
    listen 44310 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    root /usr/share/nginx/html;

    location / {
        try_files /placeholder.html =404;
    }
}

