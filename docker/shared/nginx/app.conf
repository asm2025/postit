# postit-nginx-app (compose profile "app"): TLS for the API (44310) and worker (44311),
# proxied to postit-server; web (44315) proxied to the server's web listener (8082) with the web CSP.

server {
    listen 44310 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    location / {
        proxy_pass http://postit-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

server {
    listen 44311 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    location / {
        proxy_pass http://postit-server:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 44315 ssl;
    server_name postit.local;

    ssl_certificate     /etc/nginx/certs/postit.local.crt;
    ssl_certificate_key /etc/nginx/certs/postit.local.key;

    # The web app's CSP, nosniff, Referrer-Policy and X-Frame-Options come from postit-server.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://postit-server:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
