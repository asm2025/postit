# Production overrides.
#
#   ./stack.ps1 up production         # Windows
#   ./stack.sh up production          # macOS / Linux
#
# Which resolves to:
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.production.yml up -d
#
# Same shape as docker-compose.qa.yml (plan 02, "QA and production hosting"): separate
# api and worker services, secrets from the vault, no published database port, no
# nginx and no IdP. TLS is terminated by the operator's reverse proxy on 443:
#
#   https://api.postit.com   -> 127.0.0.1:8080  (postit-api, API port)
#   https://app.postit.com   -> 127.0.0.1:8082  (postit-api, web port)
#   https://auth.postit.com  -> the operator's OIDC provider, not in this file
#
# Every hostname and the mail sender are required variables (`docker/.env`, see
# `docker/.env.example`); there are no postit.com defaults to fall back to.

# Shared by postit-api and postit-worker. Kept in step with docker-compose.qa.yml by
# hand — extension fields do not cross files.
x-postit-server: &postit-server
    # Production runs a PROMOTED image — the one qa ran — pinned with POSTIT_IMAGE.
    # The local build exists for reproducing production on a laptop.
    image: "${POSTIT_IMAGE:-postit-server:local}"
    build:
        context: ..
        dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    # Above server.shutdown_timeout (30s), so an in-flight request or job drains before
    # Docker sends SIGKILL.
    stop_grace_period: 40s
    # database.username / database.password, audit.pseudonym_key, vault.keys.<n>,
    # media.signing_key, email.signing_key, mail.smtp.username /
    # mail.smtp.password. Every other setting is config: server/config/production.toml plus the
    # environment block below.
    env_file:
        - "../!ref/vault/production/postit.env"
    depends_on:
        postit-postgres:
            condition: service_healthy
    networks:
        - postit-net

# Deployment-specific values have no default: compose refuses to resolve the file until
# each is set in the shell or in docker/.env (copy docker/.env.example), and the server
# refuses to start if one reaches it blank. The bootstrap admin is the exception, because
# it may be blank once an active admin exists; the server refuses a production start with
# no admin and no rule.
x-postit-environment: &postit-environment
    POSTIT_ENV: production
    # Plain HTTP inside the container; the reverse proxy owns TLS.
    POSTIT__SERVER__TLS__ENABLED: "false"
    POSTIT__SERVER__API_PORT: "8080"
    POSTIT__SERVER__WORKER_PORT: "8081"
    POSTIT__SERVER__PUBLIC_URL: "${POSTIT_API_URL:?set POSTIT_API_URL in docker/.env, e.g. https://api.postit.com}"
    POSTIT__APP__PUBLIC_URL: "${POSTIT_APP_URL:?set POSTIT_APP_URL in docker/.env, e.g. https://app.postit.com}"
    POSTIT__CORS__ALLOWED_ORIGINS: '["${POSTIT_APP_URL:?set POSTIT_APP_URL in docker/.env}"]'
    POSTIT__AUTH__OIDC__ISSUER: "${POSTIT_OIDC_ISSUER:?set POSTIT_OIDC_ISSUER in docker/.env, e.g. https://auth.postit.com}"
    POSTIT__AUTH__OIDC__AUDIENCES: '["${POSTIT_OIDC_AUDIENCE:?set POSTIT_OIDC_AUDIENCE in docker/.env (the IdP project or API audience)}"]'
    POSTIT__AUTH__BOOTSTRAP__ADMIN_EMAIL: "${POSTIT_BOOTSTRAP_ADMIN_EMAIL:-}"
    POSTIT__MAIL__SMTP__HOST: "${POSTIT_SMTP_HOST:?set POSTIT_SMTP_HOST in docker/.env}"
    POSTIT__MAIL__FROM_ADDRESS: "${POSTIT_MAIL_FROM:?set POSTIT_MAIL_FROM in docker/.env, e.g. postit <noreply@postit.com>}"
    # The host's reverse proxy reaches the published loopback ports through Docker's
    # gateway on postit-net, so that is the one hop allowed to set X-Forwarded-For.
    # Without it every client shares one rate-limit bucket and one audit IP.
    POSTIT__SERVER__TRUSTED_PROXIES: "[${POSTIT_TRUSTED_PROXIES:-172.30.0.1/32}]"

services:
    postit-postgres:
        # POSTGRES_USER / POSTGRES_PASSWORD.
        env_file:
            - "../!ref/vault/production/postgres.env"

    postit-api:
        <<: *postit-server
        container_name: postit-api
        environment:
            <<: *postit-environment
            POSTIT_ROLE: api
            # server/config/production.toml already enables server.web; this gives it
            # its own port so app.postit.com and api.postit.com proxy separately.
            POSTIT__SERVER__WEB__BIND: "0.0.0.0:8082"
        ports:
            # Loopback only: the reverse proxy on this host is the only way in.
            - "127.0.0.1:8080:8080"
            - "127.0.0.1:8082:8082"

    postit-worker:
        <<: *postit-server
        container_name: postit-worker
        environment:
            <<: *postit-environment
            POSTIT_ROLE: worker
        # No ports. /health and /ready on 8081 are for the container healthcheck, not the
        # internet.

networks:
    postit-net:
        ipam:
            config:
                # Fixed so the gateway in POSTIT__SERVER__TRUSTED_PROXIES is known. An
                # existing postit-net created without it must be recreated: stack down, up.
                - subnet: 172.30.0.0/24
